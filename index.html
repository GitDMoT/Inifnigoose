<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0;font:14px system-ui,sans-serif}</style></head><body>
<title>Long Goose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a portrait phone stage (full screen on phones, a framed 9:19.5 column on wide screens) holding the canvas world, with HUD pills pinned to its top corners. */
:root {
  --mustard: #DCA34B;
  --ink: #3B2416;
  --cream: #F3E4C9;
  --beak: #E58A42;
  --crust: #C27630;
  --font-display: "Fredoka", "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--mustard); color: var(--ink); }
#stage { position: fixed; inset: 0; overflow: hidden; background: #A9DAEE; }
#stage.framed { inset: auto; border: 3px solid var(--ink); border-radius: 30px; box-shadow: 0 18px 50px rgba(59,36,22,0.35); }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#c.held { cursor: grabbing; }
.hud {
  position: absolute; z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: flex; gap: 8px; flex-wrap: wrap;
  font-family: var(--font-display); font-weight: 600; font-size: 16px;
  pointer-events: none; font-variant-numeric: tabular-nums;
  right: calc(env(safe-area-inset-right, 0px) + 120px);
}
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--cream); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 5px 13px 5px 9px; line-height: 1;
}
.pill svg { width: 20px; height: 20px; flex: none; }
.pill small { font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.ctrl {
  position: absolute; z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  display: flex; gap: 8px;
}
.ctrl button {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--cream); border: 2.5px solid var(--ink); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.ctrl button:hover { background: #fff3dc; }
.ctrl button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.ctrl svg { width: 20px; height: 20px; }
.ctrl svg[hidden] { display: none; }
.tilt { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); transition: transform .1s linear; }
.tilt[hidden] { display: none; }
.ctrl button[hidden] { display: none; }
.hud[hidden] { display: none; }
canvas#c.battle { cursor: none; }
.card {
  position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(320px, calc(100% - 40px)); box-sizing: border-box; text-align: center;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; padding: 22px 20px 20px;
  font-family: var(--font-display); color: var(--ink); box-shadow: 0 14px 40px rgba(0,0,0,0.35);
}
.card[hidden] { display: none; }
.card h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; text-wrap: balance; }
.card p { margin: 0 0 18px; font-size: 15px; line-height: 1.45; font-weight: 500; }
.cardRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.card button {
  font: 600 16px var(--font-display); color: var(--ink); background: #F6E27A;
  border: 2.5px solid var(--ink); border-radius: 999px; padding: 9px 18px; cursor: pointer;
}
.card button + button { background: #fff3dc; }
.card button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.card button[hidden] { display: none; }
.tilt svg { width: 24px; height: 24px; }

</style>

<div id="stage">
<canvas id="c" aria-label="A goose with a stretchy neck. Hold and drag to steer its head upward toward bread."></canvas>

<div class="hud" aria-live="polite">
  <span class="pill" title="Bread eaten">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-8 9 L-8 0 C-11 -1 -10.5 -9 -5 -9.5 C-2 -11 2 -11 5 -9.5 C10.5 -9 11 -1 8 0 L8 9 Z" fill="#C27630" stroke="#3B2416" stroke-width="2" stroke-linejoin="round"/><path d="M-5.5 7 L-5.5 -0.5 C-7.5 -1.5 -7 -7 -3.5 -7 C-1.5 -8 1.5 -8 3.5 -7 C7 -7 7.5 -1.5 5.5 -0.5 L5.5 7 Z" fill="#F7DC9A"/></svg>
    <span id="breadCount">0</span>
  </span>
  <span class="pill" title="Neck length"><small>neck</small> <span id="neckLen">0.30 m</span></span>
  <span class="pill" title="Height of the head above the grass"><small>height</small> <span id="height">0.1 m</span></span>
</div>

<div class="ctrl">
  <button id="muteBtn" type="button" aria-label="Mute sound" title="Sound on">
    <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
  <span class="tilt" id="tiltIco" hidden title="Tilt steering on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2" stroke-linecap="round"/></svg></span>
  <button id="resetBtn" type="button" aria-label="Start over" title="Start over">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
  </button>
</div>

<div class="card" id="card" hidden role="dialog" aria-labelledby="cardTitle">
  <h2 id="cardTitle">Knocked out!</h2>
  <p id="cardStats"></p>
  <div class="cardRow">
    <button id="retryBtn" type="button">Retry the fight</button>
    <button id="againBtn" type="button">Start over</button>
  </div>
</div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const breadCountEl = document.getElementById('breadCount');
const neckLenEl = document.getElementById('neckLen');
const heightEl = document.getElementById('height');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  bg: '#DCA34B', ink: '#3B2416', cream: '#F3E4C9',
  beak: '#E58A42', beakDark: '#C95B2D', mouth: '#6E2717', patch: '#DCC6A3',
  crust: '#C27630', crumb: '#F7DC9A', hole: '#E3BC6E',
  hill: '#A9D083', treeFar: '#7DB264', grass: '#93C66E', grassDark: '#6FA855', path: '#EAD6A6',
  pond: '#7CC0D8', wood: '#9A5B32', leaf: '#5F9F4E', lampGlow: '#FBE7A1'
};
const SKY = [[0,'#E4F3F1'],[1200,'#A9DAEE'],[5000,'#7DBFE6'],[11000,'#8CC2E2'],[16000,'#F2CF7A'],[21000,'#EC9A52'],[27000,'#B9586A'],[34000,'#4E3A6E'],[42000,'#1E2148'],[60000,'#0D1030']];
const CLOUD = [[0,'#FFFFFF'],[11000,'#FFFFFF'],[17000,'#FFF0D2'],[22000,'#F8C9A0'],[28000,'#C98AA0'],[36000,'#5D5486'],[46000,'#2F3263']];
const CONE = Math.PI / 3;        // steering limit: 60 degrees either side of straight up
const NECK = 100, HALF = 50, CH = 40;
const UNITS_PER_M = 2000;          // 100 units of neck width = 5 cm

let W = 0, H = 0, DPR = 1, s0 = 1;
let pts, chunks, grown, head, vel, ang, tilt, tiltT, facing, facingT, lookTimer;
let cam, phase, t, eaten, breads, particles, bulges, texts;
let honkT, honkDur, chompT, nextHonk, dragging, pointer, downInfo, lastDragEnd, everDragged;
let stretchCharge, spawnQueue, toastTimer, hintA, zoomPunch, groundY, bottomY, neckM, heightM;
// Counter growth in metres per second at full climbing speed: starts slow and every bread speeds it up.
// A steady player (about a piece every second) reaches 500 m at roughly 45 s, then the
// exponential term takes over and space (50 km) arrives at about 1:30.
function growthRate(n) { return 0.1 + 0.19 * n + 0.0105 * n * n + 0.03 * Math.exp(n / 11); }
function mpu() { return growthRate(eaten) / (0.85 * maxSpeed()); }

/* ---------- geometry helpers ---------- */
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeOutBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

function addPt(x, y) {
  const i = pts.length;
  pts.push({ x, y });
  const k = Math.floor(i / CH);
  if (!chunks[k]) {
    const a = Math.max(0, i - 1);
    let fa = a, acc = 0;
    while (fa > 0 && acc < 75) { acc += dist(pts[fa], pts[fa - 1]); fa--; }
    chunks[k] = { a, fa, minx: Infinity, miny: Infinity, maxx: -Infinity, maxy: -Infinity };
    if (i > 0) ext(chunks[k], pts[i - 1]);
  }
  ext(chunks[k], pts[i]);
}
function ext(c, p) { c.minx = Math.min(c.minx, p.x); c.maxx = Math.max(c.maxx, p.x); c.miny = Math.min(c.miny, p.y); c.maxy = Math.max(c.maxy, p.y); }

// Point at arc length sBack behind the head, following the neck.
function pointBack(sBack) {
  let prev = head, acc = 0;
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i], d = dist(prev, p);
    if (d > 0 && acc + d >= sBack) { const k = (sBack - acc) / d; return { x: lerp(prev.x, p.x, k), y: lerp(prev.y, p.y, k) }; }
    acc += d; prev = p;
  }
  return { x: prev.x, y: prev.y };
}

/* ---------- camera ---------- */
const zoomFactor = n => n === 0 ? 1 : Math.max(0.42, 0.62 * Math.pow(0.975, n - 1));
function sTarget() { return Math.max(14 / NECK, s0 * zoomFactor(eaten)); }
function toScreen(x, y) { return { x: (x - cam.x) * cam.s + W / 2, y: (y - cam.y) * cam.s + H / 2 }; }
function toWorld(x, y) { return { x: (x - W / 2) / cam.s + cam.x, y: (y - H / 2) / cam.s + cam.y }; }
function introCam() { return { x: 0, y: (0.5 - 0.42) * H / s0 }; }
function maxSpeed() { return 430 * Math.pow(s0 / sTarget(), 0.95) * Math.min(3.5, 1 + 0.07 * eaten); }

/* ---------- setup ---------- */
function resize() {
  const old = s0;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight;
  let w = vw, h = vh;
  const framed = vw / vh > 0.66;            // wide screen: show a phone-shaped column
  if (framed) { h = vh - 32; w = Math.min(vw - 32, Math.round(h * 9 / 19.5)); }
  stage.classList.toggle('framed', framed);
  Object.assign(stage.style, framed
    ? { width: w + 'px', height: h + 'px', left: Math.round((vw - w) / 2) + 'px', top: Math.round((vh - h) / 2) + 'px' }
    : { width: '', height: '', left: '', top: '' });
  W = w; H = h;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  s0 = 0.26 * Math.min(W, H * 0.55) / NECK;
  if (cam) {
    cam.s *= s0 / old;
    if (phase === 'intro' || phase === 'first') { const ic = introCam(); cam.x = ic.x; cam.y = ic.y; }
  }
}

function reset() {
  groundY = 0.28 * H / s0; bottomY = 0.58 * H / s0;
  pts = []; chunks = [];
  addPt(0, 200000); addPt(0, 600); addPt(0, 0);
  grown = 0; neckM = 0.30; heightM = 0.25;
  head = { x: 0, y: 0 }; vel = { x: 0, y: 0 };
  ang = 0; tilt = 0; tiltT = 0; facing = 1; facingT = 1; lookTimer = 1.4;
  const ic = introCam();
  cam = { x: ic.x, y: ic.y, s: s0 };
  phase = 'intro'; t = 0; eaten = 0;
  breads = []; particles = []; bulges = []; texts = [];
  honkT = -1; honkDur = 0.32; chompT = -1; nextHonk = 1.3;
  dragging = false; pointer = null; downInfo = null; lastDragEnd = -10; everDragged = false;
  stretchCharge = 0; spawnQueue = []; toastTimer = 0; hintA = 0; zoomPunch = 0;
  started = false; aim = aimT = 0; slide = null;
  resetMusic();
  resetSpace();
  updateHud();
}

function updateHud() {
  breadCountEl.textContent = eaten;
  neckLenEl.textContent = fmtLen(neckM);
  heightEl.textContent = fmtLen(heightM);
}
function fmtLen(m) { return m < 1 ? m.toFixed(2) + ' m' : m < 100 ? m.toFixed(1) + ' m' : m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km'; }

/* ---------- bread ---------- */
function breadR() { return 45 * Math.pow(s0 / sTarget(), 0.62); }
function makeFirstBread() {
  const to = { x: 40, y: -(0.42 - 0.22) * H / s0 };
  to.y = Math.min(to.y, -230);
  const from = { x: (W / 2) / s0 + 140, y: to.y - 70 };
  breads.push({ bx: to.x, by: to.y, x: from.x, y: from.y, r: 45, rot: 0, ph: rand(0, 6), born: t,
    enter: { from, to, t0: t, dur: 2.6 }, type: 'toast' });
}
function spawnBread() {
  const s = sTarget();
  const viewH = H / s, halfW = W / 2 / s;
  const r = breadR();
  // always above the top of the screen (now, and after any zoom-out), inside the cone the neck can reach
  const top = Math.min(cam.y - H / 2 / cam.s, head.y - 0.2 * H / s - H / 2 / s);
  let best = null;
  for (let tries = 0; tries < 14; tries++) {
    const y = top - r * 2.2 - rand(0, 0.9) * viewH;
    const spread = Math.min(halfW * 0.8, (head.y - y) * Math.tan(CONE) * 0.7);
    const p = { x: head.x + rand(-1, 1) * spread, y };
    const ok = breads.every(b => Math.hypot(b.bx - p.x, b.by - p.y) > r * 3.2);
    if (ok) { best = p; break; }
    best = p;
  }
  breads.push({ bx: best.x, by: best.y, x: best.x, y: best.y, r, rot0: rand(-0.35, 0.35), ph: rand(0, 6), type: pickType() });
}
function breadCap() { return Math.min(6, 3 + Math.floor(eaten / 6)); }

/* ---------- audio ---------- */
let AC = null, master = null, muted = false, stretch = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.75;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // continuous rubbery stretch voice
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 110;
  const o2 = AC.createOscillator(); o2.type = 'square'; o2.frequency.value = 166;
  const lfo = AC.createOscillator(); lfo.frequency.value = 22;
  const lg = AC.createGain(); lg.gain.value = 9;
  lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4.5; bp.frequency.value = 800;
  const g2 = AC.createGain(); g2.gain.value = 0.3;
  o.connect(bp); o2.connect(g2); g2.connect(bp);
  const g = AC.createGain(); g.gain.value = 0;
  bp.connect(g); g.connect(master);
  o.start(); o2.start(); lfo.start();
  stretch = { o, o2, lfo, bp, g };
  initMusic();
}
function updateStretchSound(frac) {
  if (!AC || !stretch) return;
  const n = AC.currentTime;
  stretch.g.gain.setTargetAtTime(0.6 * frac, n, 0.05);
  const f = 92 + 110 * frac + 150 * stretchCharge;
  stretch.o.frequency.setTargetAtTime(f, n, 0.06);
  stretch.o2.frequency.setTargetAtTime(f * 1.51, n, 0.06);
  stretch.bp.frequency.setTargetAtTime(520 + 380 * frac + 1000 * stretchCharge, n, 0.08);
  stretch.lfo.frequency.setTargetAtTime(16 + 18 * frac, n, 0.1);
}
function sfxHonk(pitch = 1) {
  if (!AC) return;
  const n = AC.currentTime, dur = 0.3;
  const out = AC.createGain();
  out.gain.setValueAtTime(0.0001, n);
  out.gain.exponentialRampToValueAtTime(0.55, n + 0.025);
  out.gain.setValueAtTime(0.5, n + dur * 0.6);
  out.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  const shaper = AC.createWaveShaper();
  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3.2); }
  shaper.curve = curve;
  const f1 = AC.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 900; f1.Q.value = 3;
  const f2 = AC.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1700; f2.Q.value = 4;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  const mix = AC.createGain(); mix.gain.value = 1.6;
  [[ 'sawtooth', 1 ], [ 'square', 1.008 ]].forEach(([type, det]) => {
    const o = AC.createOscillator(); o.type = type;
    const fq = o.frequency;
    fq.setValueAtTime(250 * pitch * det, n);
    fq.linearRampToValueAtTime(410 * pitch * det, n + 0.045);
    fq.exponentialRampToValueAtTime(360 * pitch * det, n + dur * 0.65);
    fq.exponentialRampToValueAtTime(240 * pitch * det, n + dur);
    o.connect(shaper); o.start(n); o.stop(n + dur + 0.02);
  });
  shaper.connect(f1); shaper.connect(f2); shaper.connect(lp);
  f1.connect(mix); f2.connect(mix);
  const lpg = AC.createGain(); lpg.gain.value = 0.25; lp.connect(lpg); lpg.connect(out);
  mix.connect(out); out.connect(master);
}
function sfxGobble() {
  if (!AC) return;
  const n = AC.currentTime;
  for (let i = 0; i < 3; i++) {
    const t0 = n + i * 0.085;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200 - i * 300; bp.Q.value = 1.2;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.5, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t0, Math.random() * 0.3, 0.07);
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(560 - i * 60, t0); o.frequency.exponentialRampToValueAtTime(150, t0 + 0.075);
    const og = AC.createGain(); og.gain.setValueAtTime(0.45, t0); og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.08);
    o.connect(og); og.connect(master); o.start(t0); o.stop(t0 + 0.09);
  }
  const t1 = n + 0.31;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(320, t1); o.frequency.exponentialRampToValueAtTime(65, t1 + 0.2);
  const og = AC.createGain(); og.gain.setValueAtTime(0.0001, t1); og.gain.exponentialRampToValueAtTime(0.75, t1 + 0.02); og.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.22);
  o.connect(og); og.connect(master); o.start(t1); o.stop(t1 + 0.24);
}
function sfxPop() {
  if (!AC) return;
  const n = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(620, n); o.frequency.exponentialRampToValueAtTime(1250, n + 0.08);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.18, n + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.12);
  o.connect(g); g.connect(master); o.start(n); o.stop(n + 0.13);
}


/* ---------- climbing music: uplifting trance with a goose in the band ---------- */
let STEP = 60 / 138 / 4;   // 138 BPM, then 142 after the drop
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
// vi - IV - I - V in C (Am F C G), two bars each
const CHORDS = [
  { pad: [57, 60, 64, 69], arp: [69, 72, 76, 81], bass: 45, stab: 57 },
  { pad: [53, 57, 60, 65], arp: [65, 69, 72, 77], bass: 41, stab: 53 },
  { pad: [55, 60, 64, 67], arp: [67, 72, 76, 79], bass: 48, stab: 60 },
  { pad: [55, 59, 62, 67], arp: [67, 71, 74, 79], bass: 43, stab: 55 }

    // iOS asks for permission, and only from the tap itself
    if (typeof DOE.requestPermission === 'function') DOE.requestPermission().catch(() => {});
  } catch (err) { /* blocked here */ }
}

function startGrow() {
  phase = 'grow';
  zoomPunch = 1;
  for (let i = 0; i < breadCap(); i++) spawnQueue.push(t + 0.4 + i * 0.3);
}

/* ---------- update ---------- */
function update(dt) {
  t += dt;

  // intro: bread drifts in after a few seconds
  if (phase === 'intro' && t > 2.8) { phase = 'first'; makeFirstBread(); }

  // aim: phone tilt if the sensor answers, otherwise the thumb slide (which eases back to straight up)
  if (space.on) {
    // steering belongs to the launch / drift now
  } else if (gyro.active) {
    const tl = gyro.tilt, dz = 2.5;
    const v = Math.abs(tl) < dz ? 0 : (tl - Math.sign(tl) * dz);
    aimT = clamp(v / 26 * CONE, -CONE, CONE);
    tiltIco.style.transform = `rotate(${clamp(tl, -45, 45)}deg)`;
  } else if (!dragging) {
    aimT = lerp(aimT, 0, Math.min(1, dt * 2.5));
  }
  aim = lerp(aim, aimT, Math.min(1, dt * 8));

  // head movement: climbing is automatic once started
  let desired = { x: 0, y: 0 };
  const ms = maxSpeed();
  if (space.on) {
    desired = spaceVelocity();
  } else if (started) {
    const sp = ms * 0.85 * Math.min(1, (t - (update.t0 ?? (update.t0 = t))) * 1.2 + 0.2);
    desired = { x: Math.sin(aim) * sp, y: -Math.cos(aim) * sp };
  } else update.t0 = undefined;
  const k = Math.min(1, dt * 8);
  vel.x = lerp(vel.x, desired.x, k); vel.y = lerp(vel.y, desired.y, k);
  head.x += vel.x * dt; head.y += vel.y * dt;
  if (vel.y < 0) heightM += -vel.y * dt * mpu();
  const speed = Math.hypot(vel.x, vel.y);
  const frac = clamp(speed / Math.max(1, ms), 0, 1);
  stretchCharge = frac > 0.15 ? Math.min(1, stretchCharge + dt * 0.5) : Math.max(0, stretchCharge - dt * 2.5);
  // the rubbery stretch backs off as the music takes over
  const musicIn = mus ? Math.max(mus.lv.pad, mus.lv.arp) : 0;
  updateStretchSound(frac * (0.3 + 0.7 * Math.min(1, Math.abs(aimT - aim) * 3 + (1 - musicIn))) * (1 - 0.6 * musicIn));

  // grow the neck
  const last = pts[pts.length - 1];
  const SP = space.on ? Math.max(12, 14 / cam.s) : Math.max(8, 2.5 / cam.s);
  const dl = dist(last, head);
  if (dl > SP) { addPt(head.x, head.y); grown += dl; neckM += dl * mpu(); }

  // head angle follows the neck
  const back = pointBack(60);
  const bdx = head.x - back.x, bdy = head.y - back.y;
  if (Math.hypot(bdx, bdy) > 2) { const ta = Math.atan2(bdx, -bdy); ang += angDiff(ang, ta) * Math.min(1, dt * 12); }

  // looking around
  if (space.on) {
    facingT = 1; tiltT = 0;
  } else if (started) {
    if (aim < -0.12) facingT = 1; else if (aim > 0.12) facingT = -1;
    tiltT = 0;
    nextHonk -= dt * 0.4;
    if (nextHonk <= 0 && honkT < 0) { honk(); nextHonk = rand(4, 9); }
  } else {
    lookTimer -= dt;
    if (lookTimer <= 0) {
      lookTimer = rand(1.1, 2.6);
      if (Math.random() < 0.75) facingT = -facingT;
      tiltT = rand(-0.28, 0.22);
    }
    nextHonk -= dt;
    if (nextHonk <= 0 && honkT < 0) { honk(); nextHonk = rand(3.2, 7.5); if (Math.random() < 0.25) setTimeout(() => honk(1.05), 330); }
  }
  facing = lerp(facing, facingT, Math.min(1, dt * 9));
  tilt = lerp(tilt, tiltT, Math.min(1, dt * 4));
  if (honkT >= 0) { honkT += dt; if (honkT > honkDur) honkT = -1; }
  if (chompT >= 0) { chompT += dt; if (chompT > 0.55) chompT = -1; }

  // bread
  for (const b of breads) {
    if (b.enter) {
      const p = clamp((t - b.enter.t0) / b.enter.dur, 0, 1), e = easeOutCubic(p);
      b.bx = lerp(b.enter.from.x, b.enter.to.x, e);
      b.by = lerp(b.enter.from.y, b.enter.to.y, e) + Math.sin(p * Math.PI * 2.2) * 40 * (1 - p);
      b.rot = Math.sin(p * Math.PI * 3) * 0.35 * (1 - p);
      if (p >= 1) { b.enter = null; b.arrived = t; }
    }
    const bob = reduceMotion ? 0 : 1;
    b.x = b.bx + Math.sin(t * 0.9 + b.ph) * 4 * bob;
    b.y = b.by + Math.sin(t * 1.6 + b.ph) * 7 * bob;
    b.rr = (b.enter ? b.rot : Math.sin(t * 1.1 + b.ph) * 0.08) + (b.rot0 || 0);
  }
  const tip = beakTip();
  const hc = { x: head.x + 5 * Math.sin(ang), y: head.y - 5 * Math.cos(ang) };
  for (const b of breads.slice()) {
    const hr = b.r * (b.type === 'baguette' ? 1.15 : 1);
    if (dist(tip, b) < hr * 0.9 + 22 || dist(hc, b) < hr * 0.8 + 48) eat(b);
  }
  // climbed past the first slice without eating it: carry on anyway
  if (phase === 'first' && breads[0] && head.y < breads[0].by - 260) { breads.length = 0; startGrow(); }
  if (phase === 'grow') {
    const viewBottom = cam.y + H / 2 / cam.s;
    for (const b of breads.slice()) if (b.by - b.r > viewBottom && b.by > head.y) breads.splice(breads.indexOf(b), 1);
  }
  while (spawnQueue.length && spawnQueue[0] <= t) {
    spawnQueue.shift();
    if (breads.length < breadCap() && !space.on) spawnBread();
  }
  if (phase === 'grow' && !space.on && breads.length + spawnQueue.length < breadCap()) spawnQueue.push(t + 0.25);
  updateMusic(dt);
  if (Math.random() < 0.1) updateHud();

  // particles, bulges, texts
  for (const p of particles) { if (!p.nog) p.vy += 900 / cam.s * dt * 0.6; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => t - p.t0 < p.life);
  const bulgeSpeed = 520 * Math.pow(s0 / cam.s, 0.7) + speed;
  for (const g of bulges) g.s += bulgeSpeed * dt;
  bulges = bulges.filter(g => g.s < Math.min(600 + grown + 400, 9000 / cam.s * s0));
  texts = texts.filter(x => t - x.t0 < 1.0);

  // camera
  const st = sTarget();
  if (space.on) {
    spaceCamera(dt);
  } else if (phase === 'grow') {
    cam.s = lerp(cam.s, st, Math.min(1, dt * (zoomPunch > 0 ? 1.4 : 1.0)));
    zoomPunch = Math.max(0, zoomPunch - dt * 0.5);
    // head sits low on the screen so you can see what's coming
    const tx = head.x + vel.x * 0.25;
    const ty = head.y - 0.2 * H / cam.s + vel.y * 0.25;
    cam.x = lerp(cam.x, tx, Math.min(1, dt * 3));
    cam.y = lerp(cam.y, ty, Math.min(1, dt * 4));
  } else {
    // keep the head comfortably on screen before the first bite
    const hs = toScreen(head.x, head.y);
    const mx = W * 0.18, my = H * 0.3;
    let cx = cam.x, cy = cam.y;
    if (hs.x < mx) cx -= (mx - hs.x) / cam.s; else if (hs.x > W - mx) cx += (hs.x - (W - mx)) / cam.s;
    if (hs.y < my) cy -= (my - hs.y) / cam.s; else if (hs.y > H - my * 0.6) cy += (hs.y - (H - my * 0.6)) / cam.s;
    cam.x = lerp(cam.x, cx, Math.min(1, dt * 5)); cam.y = lerp(cam.y, cy, Math.min(1, dt * 5));
  }

  // arrow toward the first slice until the player starts
  const fb = breads[0];
  const wantHint = phase === 'first' && !started && fb && fb.arrived && t - fb.arrived > 0.6;
  hintA = clamp(hintA + (wantHint ? dt * 1.6 : -dt * 4), 0, 1);

  // above 50 km the goose leaves the planet
  if (!space.on && phase === 'grow' && neckM >= SPACE_AT) startSpace();
  if (space.on) updateSpace(dt);
}

/* ---------- space: launch, the aliens' collar, and the turret fight ---------- */
const SPACE_AT = 50000;                       // metres of neck
const MONSTERS = {
  grunt:  { r: 18, hp: 1, sp: 85,  dmg: 1, col: '#7BC86C' },
  zipper: { r: 14, hp: 1, sp: 160, dmg: 1, col: '#B57BE0' },
  brute:  { r: 30, hp: 4, sp: 50,  dmg: 2, col: '#E0645A' }
};
const COLLAR_BACK = 150;                     // collar sits this far down the neck from the head
const cardEl = document.getElementById('card');
const hudEl = document.querySelector('.hud');
const resetBtnEl = document.getElementById('resetBtn');
const space = {};
function resetSpace() {
  Object.assign(space, {
    on: false, stage: '', t0: 0, launchY: null, warp: 0, earthT: 0,
    saucer: null, bubble: null, collarP: 0, turretA: -Math.PI / 2, barrel: 0, recoil: 0,
    shield: 12, maxShield: 12, monsters: [], shots: [], globs: [], boss: null, bossSpawned: false, battleT0: 0, spawnAcc: 0,
    kills: 0, shake: 0, reticle: null, holding: false, holdT0: 0, fireCd: 0, beam: null, endAt: 0, cardShown: false, lasted: 0, camF: { x: 0.5, y: 0.5 }
  });
  if (cardEl) cardEl.hidden = true;
  if (hudEl) hudEl.hidden = false;
  if (resetBtnEl) resetBtnEl.hidden = false;
  cv.classList.remove('space', 'battle');
}
const sStage = () => t - space.t0;
const px = v => v / cam.s;                   // screen pixels -> world units


function startSpace() {
  space.on = true; space.stage = 'launch'; space.t0 = t;
  space.launchY = cam.y - H / 2 / cam.s;     // no clouds above this line
  dragging = false; slide = null; spawnQueue.length = 0; hintA = 0;
  space.camF = { x: (toScreen(head.x, head.y).x / W), y: (toScreen(head.x, head.y).y / H) };
  cv.classList.add('space');
  resetBtnEl.hidden = true;          // no accidental restarts mid-flight; the end card offers Start over
  sfxWhoosh(2.4, 300, 4000, 0.3);
}
function battleZoom() { return Math.max(14 / NECK, s0 * 0.45); }
const CRUISE = 760;                          // screen px per second once out in space

function spaceVelocity() {
  const st = space.stage, tt = sStage();
  if (st === 'launch') {
    // curve hard to the right and blast off; the speed never drops back
    aimT = Math.PI / 2 - 0.18;
    aim = lerp(aim, aimT, Math.min(1, 1 / 60 * 1.6));
    const sp = Math.max(0.85 * maxSpeed() * (1 + 1.6 * smooth(0, 1.4, tt)), px(CRUISE) * smooth(0, 2, tt));
    return { x: Math.sin(aim) * sp, y: -Math.cos(aim) * sp };
  }
  // cruising fast, the neck snaking behind
  aimT = Math.PI / 2 - 0.08 + (space.stage === 'ko' ? 0.35 : 0.2 * Math.sin(t * 0.9));
  aim = lerp(aim, aimT, Math.min(1, 1 / 60 * 2));
  const sp = px(CRUISE);
  return { x: Math.sin(aim) * sp, y: -Math.cos(aim) * sp };
}
function spaceCamera(dt) {
  const fight = space.stage !== 'launch';
  const zs = fight ? battleZoom() : Math.max(14 / NECK, s0 * 0.4);
  cam.s = lerp(cam.s, zs, Math.min(1, dt * 1.2));
  // the head eases to just right of centre and stays locked there however fast it goes
  const k = Math.min(1, dt * 1.5);
  space.camF.x = lerp(space.camF.x, 0.58, k); space.camF.y = lerp(space.camF.y, 0.56, k);
  cam.x = head.x - (space.camF.x - 0.5) * W / cam.s;
  cam.y = head.y - (space.camF.y - 0.5) * H / cam.s;
}

function updateSpace(dt) {
  const tt = sStage();
  const wTarget = space.stage === 'launch' ? smooth(0.3, 1.5, tt) : 0.55;
  space.warp = lerp(space.warp, wTarget, Math.min(1, dt * 2));
  space.earthT += dt;
  space.shake = Math.max(0, space.shake - dt * 3);
  space.recoil = Math.max(0, space.recoil - dt * 6);
  if (space.beam && t - space.beam.t0 > 0.45) space.beam = null;

  if (space.stage === 'launch' && tt > 5.5) {
    space.stage = 'saucer'; space.t0 = t;
    space.saucer = { x: head.x + px(W), y: head.y - px(H * 0.7), phase: 'in' };
    sfxWhoosh(1.2, 1800, 500, 0.18);
  }
  // the saucer flies along with the goose
  if (space.saucer) { space.saucer.x += vel.x * dt; space.saucer.y += vel.y * dt; }
  if (space.stage === 'saucer') updateSaucer(dt, sStage());
  if (space.stage === 'battle') updateBattle(dt);
  if (space.stage === 'win' || space.stage === 'ko') {
    updateBattleObjects(dt, false);
    if (space.stage === 'win') {
      updateSaucer(dt, sStage());
      if (Math.random() < dt * 5) firework();
    }
    if (!space.cardShown && t > space.endAt) showCard();
  }
}

// how far into the fight, and how fierce it is (0..1 over 90 s)
const BOSS_AT = 90;
function battleTime() { return t - space.battleT0; }
function spawnMonster(type, x, y) {
  const d = MONSTERS[type];
  let wx = x, wy = y;
  if (wx == null) {
    // from ahead (right edge) or above (top edge), the way the goose is flying
    let sx, sy;
    if (Math.random() < 0.55) { sx = W + 40; sy = rand(0.02, 0.62) * H; }
    else { sx = rand(0.3, 1.0) * W; sy = -40; }
    const p = toWorld(sx, sy); wx = p.x; wy = p.y;
  }
  const heat = clamp(battleTime() / BOSS_AT, 0, 1);
  space.monsters.push({ type, x: wx, y: wy, r: px(d.r), hp: d.hp, max: d.hp, sp: d.sp * (1 + 0.3 * heat),
    tS: Math.random() < 0.25 ? 0 : rand(40, Math.min(px(W * 0.55), 2400)), wob: rand(0, 6), flash: 0, born: t });
}
function nextSpawnType() {
  const bt = battleTime(), r = Math.random();
  const zip = smooth(8, 40, bt) * 0.35, brute = smooth(25, 70, bt) * 0.22;
  return r < brute ? 'brute' : r < brute + zip ? 'zipper' : 'grunt';
}

function fireShot() {
  const fr = collarFrame();
  const a = space.turretA, L = 78;
  const tip = { x: fr.turret.x + Math.cos(a) * L, y: fr.turret.y + Math.sin(a) * L };
  const sp = px(620);
  space.shots.push({ x: tip.x, y: tip.y, vx: Math.cos(a) * sp + vel.x, vy: Math.sin(a) * sp + vel.y, t0: t, r: px(9) });
  space.recoil = 0.7;
  sfxLaser();
}
// a charged release: a piercing beam that hits everything along its line
function fireBeam(power) {
  const fr = collarFrame();
  const a = space.turretA, L = 78;
  const ox = fr.turret.x + Math.cos(a) * L, oy = fr.turret.y + Math.sin(a) * L;
  const dx = Math.cos(a), dy = Math.sin(a), width = px(16 + 30 * power);
  const hitLine = (p, r) => { const u = (p.x - ox) * dx + (p.y - oy) * dy; if (u < -r) return false; return Math.abs((p.x - ox) * dy - (p.y - oy) * dx) < r + width / 2; };
  const dmg = 2 + Math.round(3 * power);
  for (const m of space.monsters.slice()) if (hitLine(m, m.r)) hurtMonster(m, dmg);
  for (const g of space.globs.slice()) if (hitLine(g, g.r)) { space.globs.splice(space.globs.indexOf(g), 1); burst(g.x, g.y, '#B7F28A', 8, 200); }
  if (space.boss && hitLine(space.boss, space.boss.r)) { space.boss.hp -= 4 + Math.round(8 * power); space.boss.flash = 1; if (space.boss.hp <= 0) bossDown(); }
  space.beam = { t0: t, a, power };
  space.recoil = 1.6; space.shake = 0.35 + 0.4 * power;
  sfxBeam(power);
}
function hurtMonster(m, n) {
  m.hp -= n; m.flash = 1;
  if (m.hp <= 0) {
    space.monsters.splice(space.monsters.indexOf(m), 1); space.kills++;
    burst(m.x, m.y, MONSTERS[m.type].col, m.type === 'brute' ? 22 : 13, 300); sfxPopMonster(m.type === 'brute' ? 1.4 : 1);
  } else sfxTink();
}
function chargeLevel() { return space.holding ? clamp((t - space.holdT0 - 0.18) / 1.1, 0, 1) : 0; }
function pressFire(p) { space.reticle = p; space.holding = true; space.holdT0 = t; }
function releaseFire() {
  if (!space.holding) return;
  const c = chargeLevel();
  space.holding = false;
  stopChargeSound();
  if (space.stage !== 'battle') return;
  if (c >= 0.3) fireBeam(c);
  else if (space.fireCd <= 0) { fireShot(); space.fireCd = 0.16; }
}

function updateBattle(dt) {
  const bt = battleTime();
  // continuous stream, steadily denser
  if (!space.boss || bt > BOSS_AT) {
    space.spawnAcc += dt;
    const gap = space.boss ? 3.2 : lerp(1.3, 0.5, smooth(0, BOSS_AT, bt));
    while (space.spawnAcc > gap) {
      space.spawnAcc -= gap;
      const n = Math.random() < smooth(20, 80, bt) * 0.3 ? 3 : 1;   // little swarms
      const type = nextSpawnType();
      for (let i = 0; i < n; i++) spawnMonster(type);
    }
  }
  if (!space.bossSpawned && bt >= BOSS_AT) {
    space.bossSpawned = true;
    const p = toWorld(W * 0.8, -200);
    space.boss = { x: p.x, y: p.y, r: px(78), hp: 50, max: 50, spitAt: t + 2.6, spawnAt: t + 5, flash: 0, wob: 0, born: t };
    sfxRoar();
  }
  // turret follows the reticle
  const fr = collarFrame();
  if (space.reticle) {
    const r = screenToWorldPt(space.reticle);
    const ta = Math.atan2(r.y - fr.turret.y, r.x - fr.turret.x);
    space.turretA += angDiff(space.turretA, ta) * Math.min(1, dt * 18);
  }
  space.fireCd -= dt;
  const c = chargeLevel();
  if (c > 0) updateChargeSound(c);
  updateBattleObjects(dt, true);
}

function updateBattleObjects(dt, live) {
  // everything rides along with the goose's flight
  const fx = vel.x * dt, fy = vel.y * dt;
  for (const s of space.shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  space.shots = space.shots.filter(s => t - s.t0 < 1.6);
  for (const m of space.monsters.slice()) {
    m.flash = Math.max(0, m.flash - dt * 6);
    m.x += fx; m.y += fy;
    if (!live) { m.y -= px(260) * dt; m.x += px(200) * dt; continue; }        // leaving
    const target = m.tS === 0 ? head : pointBack(m.tS);
    let dx = target.x - m.x, dy = target.y - m.y; const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    const sp = px(m.sp);
    let wx = 0, wy = 0;
    if (m.type === 'zipper') { const w = Math.sin((t - m.born) * 6 + m.wob) * 0.9; wx = -dy * w; wy = dx * w; }
    else if (m.type === 'grunt') { const w = Math.sin((t - m.born) * 2.5 + m.wob) * 0.35; wx = -dy * w; wy = dx * w; }
    m.x += (dx + wx) * sp * dt; m.y += (dy + wy) * sp * dt;
    if (neckHit(m, m.r * 0.8)) {
      space.monsters.splice(space.monsters.indexOf(m), 1);
      damage(MONSTERS[m.type].dmg, m);
    }
  }
  const b = space.boss;
  if (b) {
    b.flash = Math.max(0, b.flash - dt * 6);
    if (live) {
      const e = smooth(0, 2.2, t - b.born);
      const home = toWorld(W * 0.55 + Math.sin(t * (b.hp < b.max / 2 ? 0.9 : 0.55)) * W * 0.3, lerp(-160, H * 0.2, e));
      b.x = lerp(b.x + fx, home.x, Math.min(1, dt * 2)); b.y = lerp(b.y + fy, home.y, Math.min(1, dt * 2));
      const angry = b.hp < b.max / 2;
      if (t > b.spitAt) {
        b.spitAt = t + (angry ? 2.3 : 3.1);
        for (let i = 0; i < (angry ? 3 : 2); i++) {
          const tg = pointBack(rand(0, Math.min(px(W * 0.55), 2400)));
          const a = Math.atan2(tg.y - b.y, tg.x - b.x) + rand(-0.12, 0.12);
          space.globs.push({ x: b.x, y: b.y + b.r * 0.4, vx: Math.cos(a) * px(100), vy: Math.sin(a) * px(100), r: px(13), t0: t });
        }
        sfxSpit();
      }
      if (t > b.spawnAt) { b.spawnAt = t + (angry ? 5 : 6.5); for (let i = 0; i < 2; i++) spawnMonster(i ? 'zipper' : 'grunt', b.x + rand(-b.r, b.r), b.y); }
    } else { b.x += fx; b.y += fy - px(200) * dt; }
  }
  for (const g of space.globs.slice()) {
    g.x += g.vx * dt + fx; g.y += g.vy * dt + fy;
    if (live && neckHit(g, g.r)) { space.globs.splice(space.globs.indexOf(g), 1); damage(1, g); }
    else if (t - g.t0 > 9) space.globs.splice(space.globs.indexOf(g), 1);
  }
  if (!live) return;
  for (const s of space.shots.slice()) {
    let hit = false;
    for (const m of space.monsters) {

    }

}
function burst(x, y, col, n, spd) {

}
function showCard() {

}
function retryFight() {

function collarFrame() {
  const c = pointBack(COLLAR_BACK), a0 = pointBack(COLLAR_BACK + 25), a1 = pointBack(COLLAR_BACK - 25);
  const a = Math.atan2(a1.x - a0.x, -(a1.y - a0.y));
  // the turret goes on whichever side of the neck faces up
  const side = Math.sin(a) > 0 ? -1 : 1;
  const nx = Math.cos(a) * side, ny = Math.sin(a) * side;
  return { c, a, side, turret: { x: c.x + nx * (HALF + 22), y: c.y + ny * (HALF + 22) } };
}
function screenToWorldPt(p) { return toWorld(p.x, p.y); }


function updateSaucer(dt, tt) {
  const s = space.saucer; if (!s) return;
  const fr = collarFrame();
  let tx, ty, k = Math.min(1, dt * 2.5);
  const hover = toWorld(W * 0.72, H * 0.27);
  if (space.stage === 'win') {
    tx = hover.x; ty = hover.y;
    if (tt > 1 && !space.bubble) { space.bubble = { txt: 'Thank you, space goose!', t0: t }; sfxAlienTalk(12); }
  } else if (tt < 1.6) { tx = hover.x; ty = hover.y; }
  else if (tt < 4.2) {
    tx = hover.x; ty = hover.y;
    if (!space.bubble) { space.bubble = { txt: 'Please help us!', t0: t }; sfxAlienTalk(9); }
  } else if (tt < 6.2) {
    // swoop to the neck and fit the collar
    space.bubble = null;
    tx = fr.turret.x + px(10); ty = fr.turret.y - px(110);
    k = Math.min(1, dt * 4);
    const p = clamp((tt - 4.8) / 1.1, 0, 1);
    if (space.collarP < 1 && p >= 1) { sfxClank(); space.shake = 0.5; }
    space.collarP = p;
  } else if (tt < 7.4) {
    space.barrel = clamp((tt - 6.2) / 0.8, 0, 1);
    if (!s.left) { s.left = true; sfxWhoosh(0.9, 600, 2200, 0.15); }
    s.x -= px(260) * dt; s.y -= px(460) * dt;
    return;
  } else {
    space.saucer = null; space.stage = 'battle'; space.t0 = t; space.battleT0 = t; space.spawnAcc = 0.8;
    space.barrel = 1; cv.classList.add('battle'); hudEl.hidden = true;
    return;
  }
  s.x = lerp(s.x, tx, k); s.y = lerp(s.y, ty, k);
}


// distance from a point to the visible neck (and head)
function neckHit(p, rad) {
  if (dist(p, head) < 60 + rad) return true;
  const reach = HALF + rad;
  const n = chunks.length;
  for (let k = n - 1; k >= 0; k--) {
    const c = chunks[k];
    if (c.maxx < p.x - reach - 10 || c.minx > p.x + reach + 10 || c.maxy < p.y - reach - 10 || c.miny > p.y + reach + 10) { if (k < n - 1) continue; }
    const bEnd = k === n - 1 ? pts.length - 1 : chunks[k + 1].a;
    for (let i = c.a; i < bEnd; i++) {
      const a = pts[i], b = pts[i + 1];
      const vx = b.x - a.x, vy = b.y - a.y, l2 = vx * vx + vy * vy || 1;
      const u = clamp(((p.x - a.x) * vx + (p.y - a.y) * vy) / l2, 0, 1);
      if (Math.hypot(a.x + vx * u - p.x, a.y + vy * u - p.y) < reach) return true;
    }
  }
  return false;
}
function damage(n, at) {
  space.shield = Math.max(0, space.shield - n);
  space.shake = 0.6;
  sfxCollarHit();
  burst(at.x, at.y, '#F6E27A', 10, 260);
  if (space.shield <= 0 && space.stage === 'battle') {
    space.lasted = battleTime(); space.holding = false; stopChargeSound();
    space.stage = 'ko'; space.t0 = t; space.endAt = t + 2.2;
    honk(0.8); setTimeout(() => honk(0.7), 380);
    burst(collarFrame().c.x, collarFrame().c.y, '#9AA3AD', 26, 420);
  }
}
function firework() {
  const p = toWorld(rand(0.1, 0.9) * W, rand(0.1, 0.5) * H);
  burst(p.x, p.y, ['#F6E27A', '#FF9AA8', '#9AE0FF', '#B7F28A'][Math.floor(Math.random() * 4)], 22, 300);
  sfxPopMonster(0.5);
}



function bossDown() {
  const b = space.boss; space.boss = null; space.kills++;
  for (let i = 0; i < 6; i++) setTimeout(() => { burst(b.x + rand(-b.r, b.r), b.y + rand(-b.r, b.r), ['#B57BE0', '#F6E27A', '#E0645A'][i % 3], 26, 420); sfxPopMonster(1.6); space.shake = 0.8; }, i * 170);
  for (const m of space.monsters) burst(m.x, m.y, MONSTERS[m.type].col, 10, 260);
  space.kills += space.monsters.length;
  space.lasted = battleTime(); space.holding = false; stopChargeSound();
  space.monsters = []; space.globs = [];
  space.stage = 'win'; space.t0 = t; space.endAt = t + 5.5; space.bubble = null;
  space.saucer = { x: head.x + px(W), y: head.y - px(H * 0.8) };
  setTimeout(() => { sfxWhoosh(1.2, 1800, 500, 0.18); }, 700);
  setTimeout(sfxWin, 1300);
}

/* ---- space drawing ---- */
function drawSpaceSky() {
  // the Earth falling away behind you
  const e = easeOutCubic(clamp(space.earthT / 7, 0, 1)), far = clamp((space.earthT - 7) / 25, 0, 1);
  const R = lerp(H * 3, H * 0.3, e) * (1 - 0.85 * far);
  const cx = lerp(W * 0.35, W * 0.16, e) - far * W * 0.5, cy = H + R * lerp(0.88, 0.45, e) - far * H * 0.15;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.06, 0, Math.PI * 2); ctx.fillStyle = 'rgba(140,200,255,0.18)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = '#3E7CC6'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#6FB35A';
  const spin = space.earthT * 0.03;
  [[-0.3, -0.6, 0.35, 0.22], [0.25, -0.75, 0.28, 0.16], [0.4, -0.3, 0.22, 0.3], [-0.55, -0.15, 0.2, 0.18], [0.05, -0.2, 0.15, 0.12]].forEach(([x, y, rx, ry], i) => {

  });

  [[-0.1, -0.85, 0.3, 0.05], [0.3, -0.55, 0.22, 0.04], [-0.45, -0.4, 0.18, 0.04]].forEach(([x, y, rx, ry]) => {
    ctx.beginPath(); ctx.ellipse(cx + (x + spin * 1.4) * R, cy + y * R, rx * R, ry * R, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = 'rgba(10,14,40,0.45)'; ctx.beginPath(); ctx.arc(cx + R * 0.45, cy + R * 0.2, R, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.restore();

  if (space.warp > 0.02) {

    }

  }
}

function drawSpaceWorld() {
  const ol = OLw();

  if (space.collarP > 0 && space.stage !== '' ) drawCollar(ol);

  }

    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.6, r, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFE680'; ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = ol * 0.7; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r * 0.3, -r * 0.2, r * 0.7, r * 0.4, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFFBEA'; ctx.fill();
    ctx.restore();
  }
  // charged beam
  if (space.beam) {
    const fr = collarFrame(), bm = space.beam, p = (t - bm.t0) / 0.45;
    const L = 78, ox = fr.turret.x + Math.cos(bm.a) * L, oy = fr.turret.y + Math.sin(bm.a) * L;
    const len = px(Math.hypot(W, H) * 1.5), wdt = px(16 + 30 * bm.power) * (1 - p * p);
    ctx.save(); ctx.translate(ox, oy); ctx.rotate(bm.a); ctx.lineCap = 'round';

}

function drawCollar(ol) {
  const fr = collarFrame();
  const p = space.collarP;
  ctx.save();
  // slide in from the saucer while it's being fitted
  if (p < 1 && space.saucer) {
    const s = space.saucer;
    ctx.globalAlpha = 0.28;
    ctx.beginPath(); ctx.moveTo(s.x - px(30), s.y + px(14)); ctx.lineTo(s.x + px(30), s.y + px(14));
    ctx.lineTo(fr.c.x + px(60), fr.c.y); ctx.lineTo(fr.c.x - px(60), fr.c.y); ctx.closePath();
    ctx.fillStyle = '#B7F28A'; ctx.fill(); ctx.globalAlpha = 1;
    const e = easeOutCubic(p);
    ctx.translate(lerp(s.x, fr.c.x, e), lerp(s.y + px(20), fr.c.y, e));
    ctx.scale(lerp(0.5, 1, e), lerp(0.5, 1, e));
  } else ctx.translate(fr.c.x, fr.c.y);
  ctx.rotate(fr.a);
  const w = HALF + 16, h = 30;
  const shakeX = space.shake > 0 ? Math.sin(t * 60) * space.shake * 4 : 0;

  ctx.beginPath(); ctx.roundRect(-w, -h, w * 2, h * 2, 10); ctx.fillStyle = '#9AA3AD'; ctx.fill();
  ctx.fillStyle = '#7D8691'; ctx.fillRect(-w, -h * 0.25, w * 2, h * 0.5);
  ctx.strokeStyle = C.ink; ctx.lineWidth = ol; ctx.stroke();
  // rivets + shield lights
  ctx.fillStyle = '#5E6670';
  for (const x of [-w + 10, w - 10]) for (const y of [-h + 9, h - 9]) { ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); }
  const lit = space.shield / space.maxShield;
  for (let i = 0; i < 4; i++) {
    const on = lit > i / 4;
    ctx.beginPath(); ctx.arc(-27 + i * 18, 0, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = on ? (lit > 0.5 ? '#7CF2A0' : lit > 0.25 ? '#F6D36A' : '#FF6B5E') : '#3E444C'; ctx.fill();
  }
  ctx.restore();
  if (p < 1) return;
  // turret
  const tp = fr.turret, bl = space.barrel;
  ctx.save(); ctx.translate(tp.x, tp.y);
  ctx.save(); ctx.rotate(space.turretA);
  const rec = space.recoil * 10;
  ctx.beginPath(); ctx.roundRect(-rec, -9, (78 * bl) - rec, 18, 5);
  ctx.fillStyle = '#6B7480'; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = ol; ctx.stroke();
  ctx.fillStyle = '#4A525B'; ctx.fillRect(78 * bl - rec - 14, -11, 10, 22);
  ctx.restore();
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fillStyle = '#B4BCC5'; ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = ol; ctx.stroke();
  ctx.beginPath(); ctx.arc(-8, -9, 9, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fillStyle = space.holding ? '#FFE680' : '#FF6B5E'; ctx.fill();
  const ch = chargeLevel();
  if (ch > 0) {
    const mx = Math.cos(space.turretA) * 82, my = Math.sin(space.turretA) * 82;
    const rr = 8 + ch * 34 + Math.sin(t * 40) * 2 * ch;
    ctx.beginPath(); ctx.arc(mx, my, rr * 1.7, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,214,90,${0.18 + 0.2 * ch})`; ctx.fill();
    ctx.beginPath(); ctx.arc(mx, my, rr, 0, Math.PI * 2); ctx.fillStyle = ch >= 1 ? '#FFF8D8' : '#FFD65A'; ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = ol * 0.7; ctx.stroke();
    // sparks pulled into the muzzle
    for (let i = 0; i < 6; i++) {
      const a = t * 3 + i * 1.05, d = (1 - ((t * 2.2 + i * 0.37) % 1)) * (60 + 40 * ch);
      ctx.beginPath(); ctx.arc(mx + Math.cos(a) * d, my + Math.sin(a) * d, 3 + 2 * ch, 0, Math.PI * 2); ctx.fillStyle = '#FFE680'; ctx.fill();
    }
  }
  ctx.restore();
}

function drawMonster(m, ol) {
  const d = MONSTERS[m.type], r = m.r, tt = t - m.born;
  const look = m.tS === 0 ? head : pointBack(m.tS);
  const la = Math.atan2(look.y - m.y, look.x - m.x);

  if (m.type === 'zipper') {
    const fl = Math.sin(tt * 30) * 0.6;

    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * r * 0.5, 0); ctx.lineTo(sd * r * 2.1, -r * (0.6 + fl)); ctx.lineTo(sd * r * 1.6, r * 0.3); ctx.lineTo(sd * r * 1.1, r * 0.1); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(sd * r * 0.35 + Math.cos(la) * r * 0.12, -r * 0.1 + Math.sin(la) * r * 0.12, r * 0.2, 0, Math.PI * 2); ctx.fillStyle = '#FF4A3A'; ctx.fill(); }
  } else if (m.type === 'brute') {
    ctx.fillStyle = '#F2E3C9';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * r * 0.45, -r * 0.7); ctx.lineTo(sd * r * 0.95, -r * 1.45); ctx.lineTo(sd * r * 0.85, -r * 0.55); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.92, 0, 0, Math.PI * 2); ctx.fillStyle = body; ctx.fill(); ctx.stroke();
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.arc(sd * r * 0.38, -r * 0.2, r * 0.22, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill(); ctx.lineWidth = ol * 0.7; ctx.stroke();
      ctx.beginPath(); ctx.arc(sd * r * 0.38 + Math.cos(la) * r * 0.08, -r * 0.2 + Math.sin(la) * r * 0.08, r * 0.1, 0, Math.PI * 2); ctx.fillStyle = C.ink; ctx.fill();
      ctx.beginPath(); ctx.moveTo(sd * r * 0.12, -r * 0.42); ctx.lineTo(sd * r * 0.62, -r * 0.55); ctx.lineWidth = ol * 1.2; ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(-r * 0.45, r * 0.35); ctx.lineTo(r * 0.45, r * 0.35); ctx.lineWidth = ol; ctx.stroke();
    ctx.fillStyle = '#FFF';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * r * 0.3, r * 0.35); ctx.lineTo(sd * r * 0.2, r * 0.58); ctx.lineTo(sd * r * 0.12, r * 0.35); ctx.closePath(); ctx.fill(); }
    // health pips
    for (let i = 0; i < m.max; i++) { ctx.beginPath(); ctx.arc((i - (m.max - 1) / 2) * r * 0.32, r * 1.25, r * 0.1, 0, Math.PI * 2); ctx.fillStyle = i < m.hp ? '#FF6B5E' : 'rgba(255,255,255,0.25)'; ctx.fill(); }
  } else {
    // grunt: wobbly blob with one big eye
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) {
      const a = i / 16 * Math.PI * 2, rr = r * (1 + (a > 0.3 && a < Math.PI - 0.3 ? 0.18 * Math.sin(a * 5 + tt * 8) : 0));
      i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = body; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -r * 0.15, r * 0.42, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill(); ctx.lineWidth = ol * 0.7; ctx.stroke();
    ctx.beginPath(); ctx.arc(Math.cos(la) * r * 0.18, -r * 0.15 + Math.sin(la) * r * 0.18, r * 0.18, 0, Math.PI * 2); ctx.fillStyle = C.ink; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.7); ctx.lineTo(r * 0.45, -r * 0.5); ctx.lineWidth = ol * 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, r * 0.45, r * 0.22, 0.1, Math.PI - 0.1); ctx.lineWidth = ol * 0.8; ctx.stroke();
  }
  ctx.restore();

function drawBoss(b, ol) {

/* ---------- drawing ---------- */
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const SKY_RGB = SKY.map(([a, c]) => [a, hexRgb(c)]);
const CLOUD_RGB = CLOUD.map(([a, c]) => [a, hexRgb(c)]);
function ramp(stops, alt) {
  if (alt <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (alt <= stops[i][0]) {
      const [a0, c0] = stops[i - 1], [a1, c1] = stops[i], k = (alt - a0) / (a1 - a0);
      return [lerp(c0[0], c1[0], k), lerp(c0[1], c1[1], k), lerp(c0[2], c1[2], k)];
    }
  }
  return stops[stops.length - 1][1];
}
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
function altAtScreenY(y) { return groundY - (cam.y + (y - H / 2) / cam.s); }
// Sky stage follows neck length: sunset around 250-330 m, stars arriving with the drop at 500 m.
const SKY_BY_NECK = [[0, 0], [0.3, 120], [3, 1200], [20, 5000], [120, 11000], [250, 16000], [330, 21000], [400, 27000], [455, 34000], [500, 42000], [800, 60000]];
function skyStage() {
  const m = neckM, S = SKY_BY_NECK;
  if (m >= S[S.length - 1][0]) return S[S.length - 1][1];
  for (let i = 1; i < S.length; i++) if (m <= S[i][0]) return lerp(S[i - 1][1], S[i][1], (m - S[i - 1][0]) / (S[i][0] - S[i - 1][0]));
  return 0;
}
// sky value at a screen row: the stage, plus a softened slice of the real height difference for a gradient
function skyAt(y) { return Math.max(0, skyStage() + (altAtScreenY(y) - altAtScreenY(H / 2)) * 0.3); }

function drawSky() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, rgb(ramp(SKY_RGB, skyAt(H * i / 6))));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars once night falls
  const camAlt = skyStage();
  const starA = smooth(29000, 42000, camAlt);
  if (starA > 0.01) {
    const G = 90, oy = -cam.y * cam.s * 0.04, ox = -cam.x * cam.s * 0.04;
    ctx.fillStyle = '#FFF6DA';
    for (let gx = Math.floor(-ox / G) - 1; gx * G + ox < W + G; gx++) for (let gy = Math.floor(-oy / G) - 1; gy * G + oy < H + G; gy++) {
      const h = hash(gx, gy, 99); if (h < 0.45) continue;
      const x = gx * G + ox + hash(gy, gx, 3) * G, y = gy * G + oy + hash(gx, gy, 5) * G;
      const tw = reduceMotion ? 1 : 0.65 + 0.35 * Math.sin(t * (1 + h * 3) + h * 40);
      ctx.globalAlpha = starA * tw * (0.4 + 0.6 * hash(gx, gy, 8));
      const r = 0.7 + hash(gx, gy, 11) * 1.4;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.globalAlpha = starA;
    const mx = W * 0.78 - (space.on ? space.earthT * W * 0.06 : 0), my = H * 0.2 + Math.max(0, 52000 - camAlt) * 0.004;
    ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fillStyle = '#FFF2CF'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke();
    ctx.fillStyle = 'rgba(59,36,22,0.12)';
    [[-9, -6, 6], [8, 7, 4.5], [5, -12, 3]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(mx + x, my + y, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1;
  }
  if (space.on) drawSpaceSky();

    const a = 1 - (t - p.t0) / p.life;
    ctx.globalAlpha = clamp(a * 1.5, 0, 1);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = p.sz * 0.35; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawScreenUI() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // floating words
  for (const x of texts) {
    const p = (t - x.t0) / 1.0;
    const s = toScreen(x.x, x.y);
    const size = (x.small ? 18 : 26) * (p < 0.15 ? easeOutBack(p / 0.15) : 1);
    if (size <= 0) continue;
    ctx.save();
    ctx.translate(s.x - x.dir * 18 * (x.small ? 0 : 1), s.y - 18 - p * 40);
    ctx.rotate(x.rot);
    ctx.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
    ctx.font = `700 ${size}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-display')}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.strokeText(x.txt, 0, 0);
    ctx.fillStyle = C.cream; ctx.fillText(x.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // off-screen bread markers
  const hs = toScreen(head.x, head.y);
  const off = breads.map(b => ({ b, s: toScreen(b.x, b.y) }))
    .filter(o => o.s.x < -o.b.r * cam.s || o.s.x > W + o.b.r * cam.s || o.s.y < -o.b.r * cam.s || o.s.y > H + o.b.r * cam.s)
    .sort((a, b) => Math.hypot(a.s.x - hs.x, a.s.y - hs.y) - Math.hypot(b.s.x - hs.x, b.s.y - hs.y))
    .slice(0, 4);
  const padT = 128, pad = 30;
  for (const o of off) {
    const dx = o.s.x - W / 2, dy = o.s.y - H / 2;
    const sx = (W / 2 - pad) / Math.abs(dx || 1e-6), sy = dy < 0 ? (H / 2 - padT) / Math.abs(dy || 1e-6) : (H / 2 - pad) / Math.abs(dy || 1e-6);
    const k = Math.min(sx, sy);
    const x = W / 2 + dx * k, y = H / 2 + dy * k;
    const a = Math.atan2(dy, dx);
    ctx.save(); ctx.translate(x, y);
    ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(27, 0); ctx.lineTo(16, -9); ctx.lineTo(16, 9); ctx.closePath();
    ctx.fillStyle = C.ink; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI * 2); ctx.fillStyle = C.cream; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke();
    drawBreadOf(o.b.type, 10, 1.8);
    ctx.restore();
  }

  // hint arrow toward the bread
  if (hintA > 0.01 && breads.length) {
    let nb = null, nd = Infinity;
    for (const b of breads) { const d = dist(b, head); if (d < nd) { nd = d; nb = b; } }
    const ux = (nb.x - head.x) / nd, uy = (nb.y - head.y) / nd;
    const a0 = toScreen(head.x + ux * 85, head.y + uy * 85);
    const a1 = toScreen(nb.x - ux * (nb.r + 26), nb.y - uy * (nb.r + 26));
    let L = Math.hypot(a1.x - a0.x, a1.y - a0.y);
    if (L > 40) {
      const maxL = Math.min(L, Math.min(W, H) * 0.42);
      const e = { x: a0.x + (a1.x - a0.x) * maxL / L, y: a0.y + (a1.y - a0.y) * maxL / L };
      L = maxL;
      const nx = -(e.y - a0.y) / L, ny = (e.x - a0.x) / L;
      const bow = Math.min(46, L * 0.28);
      const cpt = { x: (a0.x + e.x) / 2 + nx * bow, y: (a0.y + e.y) / 2 + ny * bow };
      const pulse = reduceMotion ? 0 : Math.sin(t * 4) * 0.5 + 0.5;
      ctx.save();
      ctx.globalAlpha = hintA * (0.75 + 0.25 * pulse);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const path = () => { ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.quadraticCurveTo(cpt.x, cpt.y, e.x, e.y); };
      ctx.setLineDash([2, 16]); ctx.lineDashOffset = reduceMotion ? 0 : -t * 30;
      path(); ctx.strokeStyle = C.ink; ctx.lineWidth = 11; ctx.stroke();
      path(); ctx.strokeStyle = C.cream; ctx.lineWidth = 6; ctx.stroke();
      ctx.setLineDash([]);
      const ha = Math.atan2(e.y - cpt.y, e.x - cpt.x);
      ctx.translate(e.x + Math.cos(ha) * pulse * 5, e.y + Math.sin(ha) * pulse * 5); ctx.rotate(ha);
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -13); ctx.lineTo(-3, 0); ctx.lineTo(-8, 13); ctx.closePath();
      ctx.fillStyle = C.cream; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
      ctx.restore();
    }
  }
}

function render() {
  const shx = space.shake > 0 ? (Math.random() - 0.5) * space.shake * 12 / cam.s : 0, shy = space.shake > 0 ? (Math.random() - 0.5) * space.shake * 12 / cam.s : 0;
  cam.x += shx; cam.y += shy;
  drawSky();
  drawClouds(CLOUD_LAYERS.back);
  worldXf();
  drawPark();
  drawBread();
  drawNeck();
  drawHead();
  drawSpaceWorld();
  drawForegroundGrass();
  drawClouds(CLOUD_LAYERS.front);
  drawScreenUI();
  drawSpaceUI();
  cam.x -= shx; cam.y -= shy;
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

if (/[?&]debug\b/.test(location.search)) window.__gooseJump = m => { neckM = m; eaten = Math.max(eaten, 60); };
if (/[?&]debug\b/.test(location.search)) window.__goose = () => ({ space: { st: sStage(), cp: space.collarP, stage: space.stage, shield: space.shield, bt: space.battleT0 ? battleTime() : 0, kills: space.kills, monsters: space.monsters.map(m => toScreen(m.x, m.y)), boss: space.boss && toScreen(space.boss.x, space.boss.y), globs: space.globs.map(g => toScreen(g.x, g.y)) }, t, eaten, neckM, heightM, started, head: { ...head }, cam: { ...cam }, breads: breads.map(b => ({ x: b.x, y: b.y })), mode: mus && mus.mode, lv: mus && { ...mus.lv } });
resize();
reset();
requestAnimationFrame(frame);
})();
</script>
